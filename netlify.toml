[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Deploy previews and branch deploys run with the same checks but are not "production" for
# readiness purposes (Netlify sets CONTEXT). Production-only rules: see netlify/lib/env.ts.

[dev]
  framework = "vite"
  targetPort = 5173
  port = 8888

# Single-page app fallback. The app uses hash routing, so this is mostly a safety net.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    # Script sources stay open on purpose: the sandboxed preview (srcdoc iframe) inherits this policy
    # and loads npm packages from esm.sh/jsDelivr. The iframe has an opaque origin, so it can't reach
    # this app's cookies, storage or /api. These directives still block plugins, <base> hijacking,
    # framing of the app and form posts to other sites.
    Content-Security-Policy = "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://github.com"

# Hashed build assets never change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

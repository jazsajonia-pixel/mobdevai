<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0d0f12" />
    <meta name="description" content="Chrono — build, edit, preview, and ship GitHub projects with an AI coding agent, from your phone." />
    <title>Chrono</title>
    <script>
      // Apply the saved theme before first paint so light mode doesn't flash dark.
      try { if (localStorage.getItem("mdai:theme") === "light") { document.documentElement.classList.remove("dark"); document.querySelector('meta[name="theme-color"]').setAttribute("content", "#fcfcfc"); } } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
